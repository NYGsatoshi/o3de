# Isolated PR #20230 verification. Never runs on upstream PR branch.
name: PR20230 Windows Cache TAR Verification

on:
  push:
    branches:
      - test/pr20230-cache-archive-20261025

permissions:
  contents: read

jobs:
  roundtrip:
    name: Long Path / Unicode / File Hash / TAR Timestamp
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout isolated verification branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Execute standalone archive verification
        shell: pwsh
        run: |
          & .\scripts\build\tests\pr20230_archive_verification.ps1 -FileCount 1024 -ExportDirectory (Join-Path (Get-Location) 'pr20230-archive-bundle')
      - name: Upload real TAR and independent manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PR20230-ARCHIVE-ROUNDTRIP
          path: pr20230-archive-bundle/
          if-no-files-found: error
          retention-days: 1

  compression-failure:
    name: Compression Failure Must Not Upload
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Create test cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '.ccache' | Out-Null
          [IO.File]::WriteAllText((Join-Path (Get-Location) '.ccache\sample.txt'), 'This should never be uploaded')

      - name: Inject a genuine 7-Zip archive write failure
        id: compress
        continue-on-error: true # Test harness only; production compression has no continue-on-error.
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw '7-Zip is unavailable'
          }
          $blocker = Join-Path $env:RUNNER_TEMP 'pr20230-blocker-file'
          [IO.File]::WriteAllText($blocker, 'A file, not a directory')
          $archive = Join-Path $blocker 'cache.tar'
          & $sevenZip a -ttar -y $archive '.ccache'
          $code = $LASTEXITCODE
          if ($code -eq 0) { throw 'Invalid fixture: 7-Zip unexpectedly returned success' }
          Write-Host "Expected 7-Zip write failure; exit code: $code"
          exit $code

      - name: Guarded upload - must be skipped
        id: upload
        if: steps.compress.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PR20230-SHOULD-NOT-EXIST
          path: .ccache
          if-no-files-found: error

      - name: Verify failure outcome and upload suppression
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.compress.outcome }}' -ne 'failure') {
            throw 'Compression step did not report failure'
          }
          if ('${{ steps.upload.outcome }}' -ne 'skipped') {
            throw 'Guarded upload step was not skipped'
          }
          Write-Host 'PASS: 7-Zip failure recorded; guarded artifact upload skipped'

  artifact-transport:
    name: GitHub Artifact / Independent Runner Restore
    needs: roundtrip
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout verification script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Download TAR from producer job
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: PR20230-ARCHIVE-ROUNDTRIP
          path: pr20230-archive-bundle
      - name: Verify archive restored on independent runner
        shell: pwsh
        run: |
          & .\scripts\build\tests\pr20230_archive_verification.ps1 -VerifyTransportDirectory (Join-Path (Get-Location) 'pr20230-archive-bundle')

  corrupt-archive-recovery:
    name: Corrupted TAR / Real Production Restore Step
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout real Windows extraction step and regression script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Test healthy extraction and truncated TAR cleanup
        shell: pwsh
        run: |
          & .\scripts\build\tests\pr20230_corrupted_cache_verification.ps1

  asset-processor-preflight:
    name: AssetProcessor Local Recovery Harness / Preflight
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout local recovery harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Validate PowerShell syntax and short-path fixture
        shell: pwsh
        run: |
          $file = (Resolve-Path '.\scripts\build\tests\pr20230_asset_processor_recovery.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw "AssetProcessor harness has $($parseErrors.Count) PowerShell parser errors"
          }
          & $file -PreflightOnly -EngineSource (Get-Location).Path -WorkRoot (Join-Path $env:RUNNER_TEMP 'p30')
          if ($LASTEXITCODE -ne 0) { throw "Recovery preflight failed: $LASTEXITCODE" }
